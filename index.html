<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b5c"><meta name="description" content="تطبيق ترفيهي عربي">
<link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css">
<title>فَنّك | تطبيق ترفيهي</title>
</head>
<body>
<div id="toast"></div>
<header class="topbar">
  <button class="icon" id="menuBtn">☰</button><div class="brand">فَنّك <span>🎉</span></div>
  <div class="top-actions"><button class="icon" id="installBtn" hidden>⬇️</button><button class="icon" id="profileBtn">👤</button></div>
</header>

<main>
<section id="authView" class="view active">
  <div class="hero"><div class="logo">🎭</div><h1>عالمك الترفيهي</h1><p>غرف • دردشة • ألعاب • أصدقاء</p></div>
  <div class="card auth-card">
    <div class="tabs"><button class="tab active" data-auth="login">دخول</button><button class="tab" data-auth="register">حساب جديد</button></div>
    <form id="authForm">
      <input id="name" placeholder="الاسم" hidden>
      <input id="email" type="email" placeholder="البريد الإلكتروني" required>
      <input id="password" type="password" placeholder="كلمة المرور" required>
      <button class="primary">متابعة</button>
    </form>
    <p class="hint">للتجربة: أنشئ حسابًا من «حساب جديد».</p>
  </div>
</section>

<section id="homeView" class="view">
  <div class="welcome"><div><small>أهلاً بك 👋</small><h2 id="welcomeName"></h2></div><div class="avatar">✨</div></div>
  <div class="announcement card" id="announcement"></div>
  <h3>الغرف الترفيهية</h3><div id="rooms" class="grid"></div>
  <div class="section-title"><h3>ألعاب سريعة</h3></div>
  <div class="games grid">
    <button class="game card" onclick="startQuiz()">🧠<b>تحدي سريع</b><small>اختبر معلوماتك</small></button>
    <button class="game card" onclick="startTap()">⚡<b>اضغط بسرعة</b><small>اجمع أكبر عدد</small></button>
  </div>
</section>

<section id="roomView" class="view">
  <div class="room-head"><button class="back" onclick="show('homeView')">→</button><div><h2 id="roomTitle"></h2><small id="roomOnline"></small></div></div>
  <div id="messages" class="messages"></div>
  <form id="chatForm" class="chatbar"><input id="chatInput" placeholder="اكتب رسالتك..." autocomplete="off"><button>➤</button></form>
</section>

<section id="gameView" class="view">
  <button class="back" onclick="show('homeView')">→</button><div id="gameBox" class="card gamebox"></div>
</section>

<section id="profileView" class="view">
  <button class="back" onclick="show('homeView')">→</button><div class="card profile"><div class="avatar big">✨</div><h2 id="profileName"></h2><p id="profileEmail"></p><button class="danger" onclick="logout()">تسجيل الخروج</button></div>
</section>
</main>

<nav id="nav" hidden><button onclick="show('homeView')">🏠<span>الرئيسية</span></button><button onclick="scrollToRooms()">🎙️<span>الغرف</span></button><button onclick="startQuiz()">🎮<span>ألعاب</span></button><button onclick="show('profileView')">👤<span>حسابي</span></button></nav>

<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
